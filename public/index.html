<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo Đề Xuất Thanh Toán - Hệ Thống Nội Bộ</title>
    <!-- GỌI THƯ VIỆN GIAO DIỆN TRỰC TIẾP TỪ MẠNG (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: '#da373d',
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div id="root">
      <!-- NỘI DUNG FORM SẼ ĐƯỢC HIỂN THỊ TẠI ĐÂY -->
      <div class="max-w-5xl mx-auto p-6">
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
          <!-- Header -->
          <div class="bg-slate-900 text-white px-8 py-6 flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold">Tạo Phiếu Đề Xuất Thanh Toán</h1>
              <p class="text-slate-400 text-sm mt-1">Nhập thông tin khoản chi và đính kèm hóa đơn/chứng từ hợp lệ.</p>
            </div>
            <span class="bg-blue-600/30 text-blue-300 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-500/40">Form Lập Đề Xuất</span>
          </div>

          <form class="p-8 space-y-8" onsubmit="return false;">
            <!-- 1. Thông tin chung -->
            <div>
              <h2 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2"><span>1. Thông tin chung về khoản chi</span></h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                  <label class="block text-sm font-medium text-slate-700 mb-1">Tiêu đề đề xuất <span class="text-red-500">*</span></label>
                  <input type="text" placeholder="Ví dụ: Thanh toán tiền gia hạn hạ tầng AWS tháng 10" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Loại chi phí <span class="text-red-500">*</span></label>
                  <select class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <option value="OPEX">OPEX - Chi phí vận hành</option>
                    <option value="CAPEX">CAPEX - Chi phí đầu tư tài sản</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Số tiền (VNĐ) <span class="text-red-500">*</span></label>
                  <input type="number" placeholder="0" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required />
                </div>
              </div>
            </div>

            <!-- 2. Thông tin Thụ hưởng -->
            <div>
              <h2 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-2">2. Thông tin đối tác & Tài khoản nhận tiền</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Tên Người nhận <span class="text-red-500">*</span></label>
                  <input type="text" placeholder="Công ty Cổ phần Công nghệ..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Số tài khoản / Ngân hàng <span class="text-red-500">*</span></label>
                  <input type="text" placeholder="1903xxxxxxxxx - Techcombank" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                </div>
              </div>
            </div>

            <!-- 3. Diễn giải & File -->
            <div>
              <h2 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-2">3. Diễn giải lý do & Tài liệu đính kèm</h2>
              <div class="space-y-4">
                <textarea rows="3" placeholder="Nêu rõ lý do thanh toán..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer">
                  <p class="text-slate-600 text-sm font-medium">Kéo thả file vào đây hoặc <span class="text-blue-600 underline">tải lên từ máy tính</span></p>
                </div>
              </div>
            </div>

            <!-- Footer Actions -->
            <div class="flex justify-end gap-4 pt-4 border-t">
              <button type="button" class="px-6 py-2.5 border border-slate-300 text-slate-700 font-medium rounded-lg hover:bg-slate-100 transition">Lưu bản nháp</button>
              <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md transition">Gửi Phê Duyệt</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
